<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>素早さ調整</title>
    <meta name="description" content="レギュレーション対応の素早さ調整ページです。">
    <link rel="shortcut icon" href="/favicon.png">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/pokelist.css">
    <link rel="stylesheet" href="/css/damage-calc.css">
    <link rel="stylesheet" href="/css/speed-adjust.css">
    <link rel="stylesheet" href="/css/poketools-common.css">
    <link rel="stylesheet" href="/css/tailwind-bootstrap-bridge.css">
  </head>
  <body class="speed-adjust-page">
    <header class="calc-header py-2">
      <div class="container d-flex flex-wrap justify-content-between align-items-center gap-2">
        <div>
          <p class="calc-title mb-0">ポケモンチャンピオンズ ツール</p>
          <p class="calc-subtitle mb-0" data-i18n="subtitle">[Gen 9 Champions] VGC 2026 Reg M-A</p>
        </div>
        <div class="d-flex align-items-center gap-2">
          <a class="btn btn-outline-secondary btn-sm" href="/pokelist/pokedex.html">
            <i class="bi bi-search"></i>
            <span>図鑑</span>
          </a>
          <a class="btn btn-outline-secondary btn-sm" href="/pokelist/box-party.html">
            <i class="bi bi-box-seam"></i>
            <span>ボックス</span>
          </a>
          <a class="btn btn-outline-secondary btn-sm" href="/pokelist/damage-calc.html">
            <i class="bi bi-calculator"></i>
            <span>ダメージ計算</span>
          </a>
          <a class="btn btn-outline-secondary btn-sm" href="/pokelist/speed-adjust.html">
            <i class="bi bi-speedometer2"></i>
            <span>素早さ比較</span>
          </a>
          <a class="btn btn-outline-secondary btn-sm" href="/pokelist/index.html">
            <i class="bi bi-arrow-repeat"></i>
            <span>レギュレーション変更</span>
          </a>
          <a class="btn btn-outline-secondary btn-sm" href="/pokelist/damage-calc.html#settings-panel-col">
            <i class="bi bi-gear"></i>
            <span>設定</span>
          </a>
          <ul class="nav nav-tabs lang-tabs" id="lang-tabs">
            <li class="nav-item"><button class="nav-link active" data-lang="ja" type="button">日本語</button></li>
            <li class="nav-item"><button class="nav-link" data-lang="en" type="button">English</button></li>
          </ul>
        </div>
      </div>
    </header>

    <main class="container-fluid py-3 px-3 px-xxl-4">
      <div class="row g-3 align-items-start calc-shell">
        <aside class="col-xxl-2 d-none d-xxl-block">
          <div class="ad-stack">
            <div class="ad-slot ad-rail" aria-label="left-ad-rail">AD 160x600</div>
          </div>
        </aside>

        <section class="col-12 col-xxl-8">
          <section class="speed-filter-bar mb-2">
            <div class="row g-2 align-items-end">
              <div class="col-12 col-lg-10">
                <input id="speed-search" class="form-control" type="search" data-i18n-placeholder="searchPlaceholder" placeholder="ポケモン名で検索">
              </div>
              <div class="col-12 col-lg-2 text-lg-end"></div>
            </div>
          </section>

          <section class="card panel-card speed-table-card">
            <div class="card-body p-0">
              <div class="table-responsive speed-table-wrap">
                <table class="table table-hover table-striped align-middle mb-0" id="speed-table">
                  <thead>
                    <tr>
                      <th scope="col" data-i18n="speedValue"><i class="bi bi-speedometer2"></i> 実数値</th>
                      <th scope="col" data-i18n="groupList">対象群</th>
                    </tr>
                  </thead>
                  <tbody id="speed-table-body"></tbody>
                </table>
              </div>
            </div>
          </section>
        </section>

        <aside class="col-xxl-2 d-none d-xxl-block">
          <div class="ad-stack">
            <div class="ad-slot ad-rail" aria-label="right-ad-rail">AD 160x600</div>
          </div>
        </aside>
      </div>
    </main>

    <aside class="speed-target-panel" id="speed-target-panel">
      <div class="speed-target-main">
        <div class="speed-target-head" id="speed-target-head">
          <button class="speed-target-head-main speed-target-picker-btn" id="target-picker-trigger" type="button">
            <span data-i18n="loadingTarget">調整対象を読み込み中...</span>
          </button>
          <button id="target-edit-detail" class="btn btn-sm btn-outline-secondary" type="button" data-i18n-title="editPokemon" title="詳細編集">
            <i class="bi bi-pencil-square"></i>
          </button>
          <div class="speed-mega-toggle-wrap" data-i18n-title="megaEvolution" title="メガ進化" aria-label="メガ進化">
            <input id="target-mega-enabled" type="checkbox" hidden>
            <button id="target-mega-toggle" class="btn calc-mega-toggle-button" type="button" aria-pressed="false">メガ</button>
          </div>
          <button id="target-scarf" class="btn btn-outline-secondary speed-scarf-toggle" type="button" data-i18n-title="scarf" title="こだわりスカーフ" aria-pressed="false"></button>
        </div>
        <div class="speed-target-controls" id="speed-target-controls">
          <div class="target-inline speed-value-block target-cell-eq">
            <span class="icon-label target-icon-only" data-i18n-title="speedValue" title="実数値" aria-label="実数値"><i class="bi bi-speedometer2"></i></span>
            <span id="target-current-speed" class="speed-current-value mono">-</span>
          </div>
          <button id="target-nature-cycle" class="btn btn-sm btn-outline-secondary target-nature-cycle-btn target-cell-eq" type="button" data-i18n-title="naturePlus" title="性格補正を切替">
            <i class="bi bi-emoji-smile"></i>
            <span id="target-nature-cycle-text">±0%</span>
          </button>
          <div id="target-spe-ap-wrap" class="target-inline target-cell-eq">
            <label class="icon-label target-icon-only" for="target-spe-ap" data-i18n-title="apLabel" title="努力ポイント"><i class="bi bi-lightning-charge"></i></label>
            <input id="target-spe-ap" class="form-control mono target-input" type="number" min="0" max="32" step="1" value="0">
          </div>
          <div id="target-spe-rank-wrap" class="target-inline target-cell-eq">
            <label class="form-label icon-label target-icon-only" for="target-spe-rank" data-i18n-title="rankLabel" title="ランク"><i class="bi bi-graph-up-arrow"></i></label>
            <input id="target-spe-rank" class="form-control mono target-input" type="number" min="-6" max="6" step="1" value="0">
          </div>
          <button id="speed-save-only" class="btn btn-primary target-cell-eq" type="button">
            <i class="bi bi-save"></i>
            <span>個体を保存</span>
          </button>
        </div>
        <div id="speed-save-feedback" class="speed-save-feedback" role="status" aria-live="polite"></div>
      </div>
    </aside>

    <div class="modal fade" id="target-search-modal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" data-i18n="targetSearchTitle">対象ポケモンを検索</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div class="btn-group w-100 mb-2" role="group" id="target-search-scope">
              <button type="button" class="btn btn-outline-secondary active" data-scope="all" data-i18n="allList">全リスト</button>
              <button type="button" class="btn btn-outline-secondary" data-scope="box" data-i18n="boxList">ボックス</button>
              <button type="button" class="btn btn-outline-secondary" data-scope="party" data-i18n="partyList">パーティ</button>
            </div>
            <input id="target-search-input" class="form-control mb-2" type="search" data-i18n-placeholder="searchPlaceholder" placeholder="ポケモン名で検索">
            <div id="target-search-list" class="target-search-list"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="target-box-editor-host" class="target-box-editor-host d-none" aria-hidden="true">
      <div class="target-box-editor-surface">
        <iframe id="target-box-editor-frame" class="target-box-editor-frame" src="about:blank" title="ボックス編集"></iframe>
      </div>
    </div>

    <script src="/pokelist/script-poketools-layout.js"></script>
    <script src="/pokelist/script-tailwind-modal-shim.js"></script>
    <script src="/pokelist/script-speed-adjust-v2.js"></script>
  </body>
</html>
